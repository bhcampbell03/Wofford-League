// Generic click-to-sort for any <table class="sortable">. Click a header to sort
// by that column (numeric-aware, extracts the first number in each cell so
// things like "+8", "42-18", ".643", "Rd 3" all sort sensibly); click again to
// reverse. Non-numeric columns (like team names) sort alphabetically.
function makeSortable(table){
  const thead = table.querySelector("thead");
  const tbody = table.querySelector("tbody");
  if(!thead || !tbody) return;
  const ths = Array.from(thead.querySelectorAll("th"));
  function parseVal(v){
    const m = v.replace(/,/g,"").match(/[+-]?(?:\d+\.?\d*|\.\d+)/);
    return m ? parseFloat(m[0]) : null;
  }
  ths.forEach((th, colIdx)=>{
    th.addEventListener("click", ()=>{
      const rows = Array.from(tbody.querySelectorAll("tr"));
      const newDir = th.dataset.sortDir==="asc" ? "desc" : "asc";
      ths.forEach(t=>{ t.removeAttribute("data-sort-dir"); t.classList.remove("sorted-asc","sorted-desc"); });
      th.dataset.sortDir = newDir;
      th.classList.add(newDir==="asc"?"sorted-asc":"sorted-desc");
      function cellText(row){ const c = row.children[colIdx]; return c ? c.textContent.trim() : ""; }
      const isNumeric = rows.slice(0,6).some(r=>parseVal(cellText(r))!==null);
      rows.sort((a,b)=>{
        const va = cellText(a), vb = cellText(b);
        if(isNumeric){
          const na = parseVal(va), nb = parseVal(vb);
          const na2 = na===null?-Infinity:na, nb2 = nb===null?-Infinity:nb;
          return newDir==="asc" ? na2-nb2 : nb2-na2;
        }
        return newDir==="asc" ? va.localeCompare(vb) : vb.localeCompare(va);
      });
      rows.forEach(r=>tbody.appendChild(r));
    });
  });
}

      const playoff = document.getElementById("admPlayoff").value.trim();
      const rows = [];
      const usedOwners = [];

      document.querySelectorAll(".admin-game-row").forEach(row=>{

        const scoreA = row.querySelector(".admScoreA").value;
        const teamB = row.querySelector(".admTeamB").value;

        rows.push({teamA, scoreA:parseFloat(scoreA), teamB, scoreB:parseFloat(scoreB), isChamp});
      });
      if(!allFilled){ alert("Fill in all 12 scores before generating."); return; }
      if(new Set(usedOwners).size !== 12){

      }
      const gLines = rows.map(r=>{
        const champFlag = r.isChamp ? ",true" : "";
        return `    ["${currentTeamName(r.teamA)}",${r.scoreA},"${currentTeamName(r.teamB)}",${r.scoreB}${champFlag}]`;
      }).join(",\n");
      const snippet = `{w:${week}, playoff:${playoff?`"${playoff}"`:'null'}, g:[\n${gLines}\n  ]}`;
      const out = document.getElementById("admOutputText");
      out.value = `// Year ${year}, Week ${week}${playoff?', '+playoff:''}\n${snippet}`;

    });

      const status = document.getElementById("admCopyStatus");
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(ta.value).then(()=>{ status.textContent = "Copied."; });

function setupSearch(){
  const input = document.getElementById("teamSearch");
  const box = document.getElementById("searchResults");
  if(!input || !box) return;

  const teamEntries = allOwnerIdsSorted().filter(id=>id!=="rm2").map(id=>({
    type:"team", id, label: currentTeamName(id),
    search: [currentTeamName(id), ...teamHistory(id)].join(" ").toLowerCase()
  }));
  const featureEntries = FEATURE_INDEX.map(f=>({
    type:"page", page: f.page, label: f.label,
    search: [f.label, f.page, ...(f.keywords||[])].join(" ").toLowerCase()
  }));
  const index = [...teamEntries, ...featureEntries];

  function goToResult(item){
    if(item.type==="team"){ goToTeamReport(item.id); }
    else { currentPage = item.page; renderNav(); renderPage(); window.scrollTo(0,0); }
  }

  function show(matches){
    if(!matches.length){ box.innerHTML = '<div class="none">No matches</div>'; }
    else {
      box.innerHTML = matches.map((m,i)=>`<button data-i="${i}">${m.label}${m.type==="page"?` <span class="note" style="margin:0">&middot; ${m.page}</span>`:''}</button>`).join("");
    }
    box.classList.add("open");
    box._matches = matches;
  }

  input.addEventListener("input", ()=>{
    const q = input.value.trim().toLowerCase();
    if(!q){ box.classList.remove("open"); box.innerHTML=""; return; }
    const matches = index.filter(m => m.search.includes(q)).slice(0,8);
    show(matches);
  });

  input.addEventListener("keydown", e=>{
    if(e.key==="Enter"){
      const first = box._matches && box._matches[0];
      if(first){ goToResult(first); input.value=""; box.classList.remove("open"); box.innerHTML=""; input.blur(); }
    } else if(e.key==="Escape"){
      box.classList.remove("open"); input.blur();
    }
  });

  box.addEventListener("click", e=>{
    const btn = e.target.closest("button[data-i]");
    if(!btn || !box._matches) return;
    goToResult(box._matches[+btn.dataset.i]);
    input.value = "";
    box.classList.remove("open");
    box.innerHTML = "";
  });

  document.addEventListener("click", e=>{
    if(!e.target.closest(".search-wrap")) box.classList.remove("open");
  });
}
