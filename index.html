// Final standings split into who made the real playoff bracket vs. who didn't.
function computePlayoffPicture(year){
  const qualifiers = PLAYOFF_QUALIFIERS[year] || [];
  const roster = [...SEASONS[year]].sort((a,b)=>a.rank-b.rank);
  return { cutoff: qualifiers.length, teams: roster.map(t=>({...t, made: qualifiers.includes(t.owner)})) };
}

// Who was actually still deciding their playoff fate entering the final regular-
// season week, using the same week-by-week standings already computed elsewhere.
// Compares each team's rank right before the final week to the real cutoff line.
function computeFinalWeekRace(year){
  const qualifiers = PLAYOFF_QUALIFIERS[year] || [];
  const cutoff = qualifiers.length;
  const sw = computeStandingsByWeek(year);
  if(!sw || sw.weekLabels.length < 2) return null;
  const lastIdx = sw.weekLabels.length - 1;
  const rows = sw.ids.map(id=>{
    const preRank = sw.series[id][lastIdx-1];
    const madeIt = qualifiers.includes(id);
    let status;
    if(preRank <= cutoff && madeIt) status = "In all along";
    else if(preRank > cutoff && madeIt) status = "Clinched in the final week";
    else if(preRank <= cutoff && !madeIt) status = "Lost it in the final week";
    else status = "Already eliminated";
    return {id, preRank, madeIt, status};
  });
  return {rows, lastWeek: sw.weekLabels[lastIdx]};
}

function renderPlayoffPictureHtml(year){
  const pic = computePlayoffPicture(year);
  const inTeams = pic.teams.filter(t=>t.made);
  const outTeams = pic.teams.filter(t=>!t.made);
  const row = t => `<div class="matchup-row" style="padding:7px 0"><span class="side">${t.team}</span><span class="note">${t.w}-${t.l} &middot; #${t.rank} finish</span></div>`;
  return `
    <div class="grid cols-2">
      <div class="card">
        <div class="note" style="font-weight:700;margin-bottom:4px;color:var(--green)">IN &mdash; made the playoffs (${inTeams.length})</div>
        ${inTeams.map(row).join("")}
      </div>
      <div class="card">
        <div class="note" style="font-weight:700;margin-bottom:4px;color:var(--red)">OUT (${outTeams.length})</div>
        ${outTeams.map(row).join("")}
      </div>
    </div>
  `;
}

function renderFinalWeekRaceHtml(year){
  const race = computeFinalWeekRace(year);
  if(!race) return `<p class="note">Not enough weekly data for ${year} to compute this.</p>`;
  const statuses = ["In all along","Clinched in the final week","Lost it in the final week","Already eliminated"];
  const colors = {"In all along":"var(--green)","Clinched in the final week":"var(--gold-deep)","Lost it in the final week":"var(--red)","Already eliminated":"var(--muted)"};
  return `
    <p class="note" style="margin-bottom:12px">Entering Week ${race.lastWeek}, based on each team's cumulative rank at that point versus the real playoff cutoff line.</p>
    <div class="grid cols-4">
      ${statuses.map(status=>{
        const teams = race.rows.filter(r=>r.status===status);
        if(!teams.length) return `<div></div>`;
        return `<div class="card">
          <div class="note" style="font-weight:700;margin-bottom:6px;color:${colors[status]}">${status} (${teams.length})</div>
          ${teams.map(t=>`<div style="font-size:13px;padding:2px 0">${currentTeamName(t.id)}</div>`).join("")}
        </div>`;
      }).join("")}
    </div>
  `;
}

const GLOSSARY = [
  {term:"Team Grade", def:"A single 0&ndash;100 composite score, school-letter scale. Blends career win%, average finish, top-3 finishes, bottom-3 finishes, titles, playoff appearance rate, semifinal appearance rate, and points scored. Win%, finish, top-3s, bottom-3s, and titles cover the full 2022&ndash;2025 history; playoff/semifinal rate and points scored are limited to 2024&ndash;2025, the only seasons with bracket and weekly-scoring data. Formula: 55 + 0.5935&times;[0.20&times;win% + 0.15&times;finish-rank score + top-3 bonus (capped) + title bonus (capped) &minus; bottom-3 penalty + 0.08&times;playoff rate + 0.10&times;semifinal rate + 0.10&times;points-scored score]. Calibrated so an exactly-average hypothetical team lands near a C."},
  {term:"Win% format", def:'Shown as ".643" style, no leading zero &mdash; a common shorthand for a decimal win percentage.'},
  {term:"Luck / xW / xL", def:"xW (expected wins) counts a week as a win if the team scored at or above that week's league average, regardless of who they actually played. Luck is actual wins minus xW &mdash; positive means winning more than the scoring pace suggests."},
  {term:"All-Play record", def:"A finer-grained version of xW/xL: each week, the record a team would have if they'd played all 11 other teams instead of just their actual opponent, summed across the season."},
  {term:"SOS (Strength of Schedule)", def:"Indexed to that season's league-average schedule at 100, based on the average points-per-game of a team's opponents. 110 means a schedule 10% tougher than average; 90 means 10% easier."},
  {term:"Playoff Qualifiers", def:"The teams that actually made the real playoff bracket that year (6 teams in 2024, 7 in 2025) &mdash; separate from the consolation/placement ladder played by everyone else."},
  {term:"Team Profile radar axes", def:"Reg. Season W% covers all four seasons (2022&ndash;2025). Playoff W%, High Scoring, Luck, Consistency, and Record vs. Playoff Teams are 2024&ndash;2025 only. Each axis is scaled 0&ndash;100 relative to the rest of the league. Consistency rewards a smaller week-to-week scoring swing, not higher scoring."},
  {term:"Draft Phase buckets", def:"Draft Tendencies groups picks into R1, R2-4, R5-8, R9-12, and R13-16 to show which positions a manager prioritizes at each stretch of the draft."},
  {term:"Standings Boost/Drop", def:"Compares a team's cumulative regular-season rank right before and right after a given week &mdash; a simple proxy for how much that week's results reshuffled the race. Not a true playoff-odds simulation."},
  {term:"Luckiest Win / Unluckiest Loss", def:"Within a single week, the lowest-scoring team that still won (Luckiest Win) and the highest-scoring team that still lost (Unluckiest Loss)."},
  {term:"Blowout margin", def:"Any game decided by 30 or more points, used for the Draft Pick Value and blowout-related stats."},
  {term:"Box-and-whisker (scoring range)", def:"The gold box spans a team's 25th&ndash;75th percentile weekly score (the typical week); the red line is the median; the whiskers reach out to the lowest and highest score that season."},
  {term:"Draft Position vs. Final Standing", def:"One point per draft slot (1&ndash;12), averaging that slot's final standing across the 2024 and 2025 drafts. Points aren't tied to any manager &mdash; a slot can belong to a different team each year."},
  {term:"Week 18 exclusions", def:"Rosters often sit starters in Week 18 once playoff seeding is set, which skews low-score stats. It's excluded from lowest-score calculations for that reason."},
  {term:"Franchise vs. owner", def:"A \"team\" tracks a roster slot across name changes (e.g. Wide Receiver U was once Columbia P00P). Ryan Methot (2022&ndash;2023) and Reid Mario (2024&ndash;2025) held the same slot but are tracked as separate franchises, since they're different people."}
];

const FAQS = [
  {q:"How is Team Grade calculated?", a:"See the Team Grade entry in the Stats Glossary above for the exact formula. In short: win%, average finish, top-3 and bottom-3 finish rates, titles, playoff/semifinal appearance rate, and points scored, blended into one 0&ndash;100 number on a school-letter scale."},
  {q:"Why don't 2022 and 2023 have weekly stats, charts, or box scores?", a:"Only final season standings were kept from those years &mdash; no week-by-week scores survived. Anything that needs weekly data (Luck, SOS, charts, box scores, Analytics) is scoped to 2024&ndash;2025 for that reason."},
  {q:"Who are Ryan Methot and Reid Mario?", a:"Two different people who've held the same roster slot in different eras &mdash; Ryan Methot owned it 2022&ndash;2023, Reid Mario since 2024. They're tracked as separate franchises rather than merged, since merging would mix two different managers' records together."},
  {q:"Why does 2025 say \"#TeamBen\" but earlier years say \"Team Ben\"?", a:"Owen Feld's team was actually called \"Team Ben\" in 2023 and 2024, then renamed to \"#TeamBen\" for 2025. The site reflects each season's real name at the time."},
  {q:"How do I get this week's scores added?", a:"Log in via the icon in the top-right corner (Admin), fill in the score entry form, and send the generated snippet to Claude to have it built into the next version of the site."},
  {q:"Does the site update itself automatically?", a:"No &mdash; this is a static file with no backend. Updates happen by generating a new version and re-uploading it wherever the site is hosted (see the GitHub Pages instructions if you're hosting it there)."},
  {q:"What's the difference between the Records and Records & Awards pages?", a:"Records covers head-to-head history, rivalries, and notable games between teams. Records & Awards covers season-driven superlatives (most championships, best win%, etc.) and the all-time Record Book of single-game/season bests."},
  {q:"Why are some Team Profile locations missing?", a:"Only the locations that have actually been provided are shown. Any team without one on file is noted plainly rather than guessed at."}
];

// Per-position draft profile for one owner, across every draft year with a full board.
// Builds playerName -> [{week, pts, bench}] for one season, pooling across every
// team's roster that week (a player can be found on different rosters across the
// season via waivers/trades -- this indexes by the real athlete, not by team).
const _playerSeasonIndexCache = {};
function buildPlayerSeasonIndex(year){
  if(_playerSeasonIndexCache[year]) return _playerSeasonIndexCache[year];
  const idx = {};
  const weeks = PLAYER_SCORES[year] || {};
  Object.keys(weeks).forEach(weekStr=>{
    const week = Number(weekStr);
    const teams = weeks[weekStr];
    Object.keys(teams).forEach(team=>{
      teams[team].forEach(p=>{
        (idx[p.name] = idx[p.name] || []).push({week, pts:p.pts, bench:p.bench});
      });
    });
  });
  _playerSeasonIndexCache[year] = idx;
  return idx;
}

// A drafted player's season points-per-game, averaged only over weeks they
// actually have data for (missing weeks are treated as "no data", not zero).
function playerSeasonPPG(year, playerName){
  const idx = buildPlayerSeasonIndex(year);
  const entries = idx[playerName];
  if(!entries || !entries.length) return null;
  const total = entries.reduce((a,e)=>a+e.pts, 0);
  return {ppg: total/entries.length, games: entries.length};
}

// Every pick from a draft, with that player's real season PPG attached where
// we have data for them.
function draftPicksWithPPG(year){
  const draft = DRAFTS[year];
  if(!draft || !draft.picks) return [];
  // K and D/ST are excluded from all draft value analysis -- their weekly scoring
  // is streamed/matchup-driven rather than a real reflection of the draft pick.
  return draft.picks.filter(p=>p.position!=='K' && p.position!=='D/ST').map(p=>{
    const stat = playerSeasonPPG(year, p.player);
    return {...p, ppg: stat ? stat.ppg : null, games: stat ? stat.games : 0};
  });
}

// The league's own empirical baseline: average PPG of every pick made in each
// round, pooled across both drafted seasons. This is the only honest baseline
// available without external ADP/ranking data -- "value" means beating what
// picks at that spot in this league actually returned, not a national average.
function draftRoundBaseline(){
  const byRound = {};
  [2024,2025].forEach(year=>{
    draftPicksWithPPG(year).forEach(p=>{
      if(p.ppg==null) return;
      (byRound[p.round] = byRound[p.round] || []).push(p.ppg);
    });
  });
  const baseline = {};
  Object.keys(byRound).forEach(r=>{
    const arr = byRound[r];
    baseline[r] = arr.reduce((a,b)=>a+b,0)/arr.length;
  });
  return baseline;
}

// Every pick across both years, tagged with value-over-baseline (their real PPG
// minus what picks at that round typically return in this league).
function allDraftPicksWithValue(){
  const baseline = draftRoundBaseline();
  const out = [];
  [2024,2025].forEach(year=>{
    draftPicksWithPPG(year).forEach(p=>{
      if(p.ppg==null) return;
      out.push({...p, year, baseline: baseline[p.round], value: p.ppg - baseline[p.round]});
    });
  });
  return out;
}

function round1HitRates(){
  const all = allDraftPicksWithValue();
  const byOwner = {};
  all.filter(p=>p.round===1).forEach(p=>{
    (byOwner[p.teamOwner] = byOwner[p.teamOwner] || []).push(p);
  });
  return Object.keys(byOwner).map(owner=>{
    const picks = byOwner[owner];
    const hits = picks.filter(p=>p.value > 0).length;
    return {owner, picks, hitRate: hits/picks.length, avgValue: picks.reduce((a,p)=>a+p.value,0)/picks.length};
  }).sort((a,b)=>b.avgValue-a.avgValue);
}

function valueByPhase(){
  const phases = [
    {label:"R1", min:1, max:1},
    {label:"R2-4", min:2, max:4},
    {label:"R5-8", min:5, max:8},
    {label:"R9-12", min:9, max:12},
    {label:"R13-16", min:13, max:16}
  ];
  const all = allDraftPicksWithValue();
  const owners = allOwnerIdsSorted().filter(id=>id!=="rm2");
  return phases.map(ph=>{
    const rows = owners.map(owner=>{
      const picks = all.filter(p=>p.teamOwner===owner && p.round>=ph.min && p.round<=ph.max);
      if(!picks.length) return null;
      return {owner, avgValue: picks.reduce((a,p)=>a+p.value,0)/picks.length, count: picks.length};
    }).filter(Boolean).sort((a,b)=>b.avgValue-a.avgValue);
    return {label:ph.label, rows};
  });
}

function diamondsInTheRough(){
  const all = allDraftPicksWithValue();
  return all.filter(p=>p.round>=9).sort((a,b)=>b.value-a.value).slice(0,5);
}

function worstPicksLeagueWide(){
  const all = allDraftPicksWithValue();
  return all.filter(p=>p.round<=4).sort((a,b)=>a.value-b.value).slice(0,5);
}

// Whole-draft steal/bust rate: share of an owner's picks that meaningfully beat
// (steal) or missed (bust) their round's baseline, not just their single best/worst.
// Share of an owner's draft picks that played a shortened season (fewer than
// 10 games with real scoring data) -- the best proxy available here for injury
// or lost-time luck, since there's no actual injury-report data in this dataset.
// Converts a 0-100 score to a school letter grade, same scale used everywhere
// else a person would recognize (A+ down to F).
function letterGrade(score){
  if(score>=97) return 'A+'; if(score>=93) return 'A'; if(score>=90) return 'A-';
  if(score>=87) return 'B+'; if(score>=83) return 'B'; if(score>=80) return 'B-';
  if(score>=77) return 'C+'; if(score>=73) return 'C'; if(score>=70) return 'C-';
  if(score>=67) return 'D+'; if(score>=60) return 'D';
  return 'F';
}

// One overall Draft Grade per owner, in the same spirit as Team Grade: blend
// the season's individual draft-value signals (overall value-over-baseline,
// net steal/bust rate, Round 1 performance) into a single 0-100 score, then
// convert to a letter.
function draftGradeByOwner(){
  const all = allDraftPicksWithValue();
  const owners = allOwnerIdsSorted().filter(id=>id!=="rm2");
  const sb = stealBustRates();
  const hr = round1HitRates();
  return owners.map(owner=>{
    const picks = all.filter(p=>p.teamOwner===owner);
    if(!picks.length) return null;
    const avgValue = picks.reduce((a,p)=>a+p.value,0)/picks.length;
    const sbRow = sb.find(r=>r.owner===owner);
    const hrRow = hr.find(r=>r.owner===owner);
    const netSteal = sbRow ? sbRow.stealRate - sbRow.bustRate : 0;
    const r1 = hrRow ? hrRow.avgValue : 0;
    const score = Math.max(0, Math.min(100, 75 + avgValue*10 + netSteal*30 + r1*1.5));
    return {owner, score, letter: letterGrade(score)};
  }).filter(Boolean).sort((a,b)=>b.score-a.score);
}

function injuryLuckByOwner(gamesThreshold=10, maxRound=8){
  const all = allDraftPicksWithValue();
  const owners = allOwnerIdsSorted().filter(id=>id!=="rm2");
  return owners.map(owner=>{
    const picks = all.filter(p=>p.teamOwner===owner && p.round<=maxRound);
    if(!picks.length) return null;
    const shortened = picks.filter(p=>p.games<gamesThreshold).sort((a,b)=>a.games-b.games);
    return {owner, total:picks.length, shortened: shortened.length, rate: shortened.length/picks.length, shortenedPicks: shortened};
  }).filter(Boolean).sort((a,b)=>b.rate-a.rate);
}

function stealBustRates(threshold=3){
  const all = allDraftPicksWithValue();
  const owners = allOwnerIdsSorted().filter(id=>id!=="rm2");
  return owners.map(owner=>{
    const picks = all.filter(p=>p.teamOwner===owner);
    if(!picks.length) return null;
    const steals = picks.filter(p=>p.value>=threshold).length;
    const busts = picks.filter(p=>p.value<=-threshold).length;
    return {owner, total:picks.length, steals, busts, stealRate:steals/picks.length, bustRate:busts/picks.length};
  }).filter(Boolean).sort((a,b)=>(b.stealRate-b.bustRate)-(a.stealRate-a.bustRate));
}

// Average value-over-baseline by position, per owner -- is this manager actually
// good at drafting RBs, or just good at drafting early?
function valueByPosition(){
  const all = allDraftPicksWithValue();
  const positions = [...new Set(all.map(p=>p.position))].filter(Boolean).sort();
  const owners = allOwnerIdsSorted().filter(id=>id!=="rm2");
  return positions.map(pos=>{
    const rows = owners.map(owner=>{
      const picks = all.filter(p=>p.teamOwner===owner && p.position===pos);
      if(!picks.length) return null;
      return {owner, avgValue: picks.reduce((a,p)=>a+p.value,0)/picks.length, count:picks.length};
    }).filter(Boolean).sort((a,b)=>b.avgValue-a.avgValue);
    return {position:pos, rows};
  }).filter(p=>p.rows.length);
}

// The single best-value pick at each position, league-wide, regardless of round
// (Diamonds in the Rough is round-restricted; this isn't).
// Top players at each position for a given season, by real total points scored
// that year -- not tied to draft round at all, unlike Diamonds by Position.
function leagueLeadersByPosition(year){
  const weeks = PLAYER_SCORES[year] || {};
  const totals = {};
  Object.keys(weeks).forEach(weekStr=>{
    const teams = weeks[weekStr];
    Object.keys(teams).forEach(team=>{
      teams[team].forEach(p=>{
        if(!totals[p.name]) totals[p.name] = {name:p.name, pos:p.pos, total:0, games:0};
        totals[p.name].total += p.pts;
        totals[p.name].games += 1;
      });
    });
  });
  const players = Object.values(totals);
  const positions = [...new Set(players.map(p=>p.pos))].filter(Boolean).sort();
  return positions.map(pos=>{
    const inPos = players.filter(p=>p.pos===pos).sort((a,b)=>b.total-a.total);
    return {position:pos, leaders: inPos.slice(0,5).map(p=>({...p, ppg: p.total/p.games}))};
  });
}

function diamondsByPosition(){
  const all = allDraftPicksWithValue();
  const positions = [...new Set(all.map(p=>p.position))].filter(Boolean).sort();
  return positions.map(pos=>{
    const picks = all.filter(p=>p.position===pos);
    if(!picks.length) return null;
    return {position:pos, best: picks.reduce((a,b)=>b.value>a.value?b:a)};
  }).filter(Boolean);
}

// A small-sample warning for picks with few weeks of real data (injury, late
// pickup, benching) -- context for whether a value number reflects a full season
// or a shortened one.
function durabilityNote(games){
  if(games==null) return '';
  const low = games < 10;
  return ` <span class="note"${low?' style="color:var(--red)"':''}>${low?'&#9888; ':''}${games}gm</span>`;
}

// Every owner's top/bottom picks (up to 5 each) plus their diamonds, for the
// expandable per-team draft report.
function perOwnerDraftLists(){
  const all = allDraftPicksWithValue();
  const owners = allOwnerIdsSorted().filter(id=>id!=="rm2");
  return owners.map(owner=>{
    const picks = all.filter(p=>p.teamOwner===owner);
    if(!picks.length) return null;
    const sorted = [...picks].sort((a,b)=>b.value-a.value);
    const best = sorted.slice(0,5);
    const worst = [...sorted].reverse().slice(0,5);
    const diamonds = picks.filter(p=>p.round>=9 && p.value>0).sort((a,b)=>b.value-a.value).slice(0,5);
    return {owner, best, worst, diamonds};
  }).filter(Boolean);
}

function bestWorstPicks(){
  const all = allDraftPicksWithValue();
  const owners = allOwnerIdsSorted().filter(id=>id!=="rm2");
  const perOwner = owners.map(owner=>{
    const picks = all.filter(p=>p.teamOwner===owner);
    if(!picks.length) return null;
    const best = picks.reduce((a,b)=>b.value>a.value?b:a);
    const worst = picks.reduce((a,b)=>b.value<a.value?b:a);
    const diamondCandidates = picks.filter(p=>p.round>=9 && p.value>0);
    const diamond = diamondCandidates.length ? diamondCandidates.reduce((a,b)=>b.value>a.value?b:a) : null;
    return {owner, best, worst, diamond};
  }).filter(Boolean);
  const leagueBest = all.reduce((a,b)=>b.value>a.value?b:a);
  const leagueWorst = all.reduce((a,b)=>b.value<a.value?b:a);
  return {perOwner, leagueBest, leagueWorst};
}

// Interpolates red -> gold -> green for coloring a PPG value within a min/max range.
function ppgGradientColor(value, min, max){
  if(max===min) return '#3D7A4E';
  const t = Math.max(0, Math.min(1, (value-min)/(max-min)));
  const hexToRgb = hex => { const n=parseInt(hex.slice(1),16); return [n>>16&255,n>>8&255,n&255]; };
  const rgbToHex = ([r,g,b]) => '#'+[r,g,b].map(x=>Math.round(x).toString(16).padStart(2,'0')).join('');
  const red=hexToRgb('#B23B3B'), gold=hexToRgb('#DBA514'), green=hexToRgb('#3D7A4E');
  let c1,c2,localT;
  if(t<0.5){ c1=red; c2=gold; localT=t/0.5; } else { c1=gold; c2=green; localT=(t-0.5)/0.5; }
  return rgbToHex(c1.map((v,i)=>v+(c2[i]-v)*localT));
}

function draftTendencies(id){
  const picks = [];
  const years = [];
  [2024,2025].forEach(year=>{
    const d = DRAFTS[year];
    if(d && d.picks){
      const mine = d.picks.filter(p=>p.teamOwner===id && p.position!=="D/ST");
      if(mine.length){ picks.push(...mine); years.push(year); }
    }
  });
  if(!picks.length) return null;

  const byPos = {};
  picks.forEach(p=>{ (byPos[p.position]=byPos[p.position]||[]).push(p.round); });
  const rows = Object.keys(byPos).map(pos=>{
    const rounds = byPos[pos];
    return { pos, count: rounds.length, avgRound: rounds.reduce((a,b)=>a+b,0)/rounds.length };
  }).sort((a,b)=>a.avgRound-b.avgRound);

  // Which positions dominate each stretch of the draft.
  const phases = [
    {label:"R1", min:1, max:1},
    {label:"R2-4", min:2, max:4},
    {label:"R5-8", min:5, max:8},
    {label:"R9-12", min:9, max:12},
    {label:"R13-16", min:13, max:16}
  ];
  const phaseRows = phases.map(ph=>{
    const inPhase = picks.filter(p=>p.round>=ph.min && p.round<=ph.max);
    const counts = {};
    inPhase.forEach(p=>{ counts[p.position]=(counts[p.position]||0)+1; });
    const sorted = Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
    return { label:ph.label, total:inPhase.length, counts, sorted };
  });

  const earliestPosOverall = rows[0];
  const latestPosOverall = [...rows].sort((a,b)=>b.avgRound-a.avgRound)[0];
  const summary = rows.length>=2
    ? `Goes ${earliestPosOverall.pos} earliest on average (Rd ${earliestPosOverall.avgRound.toFixed(1)}), and waits longest on ${latestPosOverall.pos} (Rd ${latestPosOverall.avgRound.toFixed(1)}).`
    : null;

  return {rows, years, phaseRows, summary};
}

function pageManagerReportCard(selectedId){
  const ids = allOwnerIdsSorted().filter(id=>id!=="rm2");

  const tLetter = letterGrade(tGrade);
  const dGradeRow = draftGradeByOwner().find(r=>r.owner===id);
  const dGrade = dGradeRow ? dGradeRow.score : 50;
  const dLetter = dGradeRow ? dGradeRow.letter : 'N/A';
  const managerScore = Math.max(0, Math.min(100, (tGrade + dGrade)/2));
  const managerLetter = letterGrade(managerScore);

  const years = [2024,2025].filter(y=>SEASONS[y] && SEASONS[y].some(t=>t.owner===id));

        <div class="num">${tLetter}</div>
        <div class="who">Team Grade</div>
        <div class="label">${tGrade.toFixed(0)}/100</div>
      </div>
      <div class="card stat-card" style="text-align:center">
        <div class="num">${dLetter}</div>
        <div class="who">Draft Grade</div>
        <div class="label">${dGrade.toFixed(0)}/100</div>
      </div>
    </div>

    <div class="table-wrap">

        ${luckRows.map(r=>`<tr><td>${r.year}</td><td class="num-cell">${r.actualW}</td><td class="num-cell">${r.xW}</td><td class="num-cell ${r.luck>0?'luck-pos':r.luck<0?'luck-neg':''}">${r.luck>0?'+':''}${r.luck}</td></tr>`).join("")}
      </tbody>

  const grade = teamGrade(id);
  const hist = teamHistory(id);
  const past = hist.slice(0,-1);

  const others = ids.filter(o=>o!==id && o!=="rm2");
  const h2hRows = others.map(o=>({o, ...h2hRecord(id,o)})).filter(r=>r.aWins+r.bWins>0);
  const best = [...h2hRows].sort((a,b)=> (b.aWins-b.bWins)-(a.aWins-a.bWins))[0];
  const nemesisPool = h2hRows.filter(r=>r.aWins+r.bWins>=2);
  const nemesis = (nemesisPool.length?nemesisPool:h2hRows).length
    ? [...(nemesisPool.length?nemesisPool:h2hRows)].sort((a,b)=> (a.aWins/(a.aWins+a.bWins)) - (b.aWins/(b.aWins+b.bWins)))[0]

function recordVsPlayoffTeams(id){
  const rows = [];
  let totalW=0, totalL=0;
  [2024,2025].forEach(year=>{
    const qualifiers = PLAYOFF_QUALIFIERS[year]||[];
    let w=0,l=0;
    (MATCHUPS[year]||[]).filter(wk=>!wk.playoff).forEach(week=>{
      week.g.forEach(([tA,sA,tB,sB])=>{
        const oA = ownerForTeam(year,tA), oB = ownerForTeam(year,tB);
        if(oA===id && qualifiers.includes(oB)){ if(sA>sB) w++; else l++; }
        if(oB===id && qualifiers.includes(oA)){ if(sB>sA) w++; else l++; }
      });
    });
    if(w+l>0){ rows.push({year, w, l}); totalW+=w; totalL+=l; }
  });
  return {rows, totalW, totalL};
}

// Generic click-to-sort for any <table class="sortable">. Click a header to sort
// by that column (numeric-aware, extracts the first number in each cell so
// things like "+8", "42-18", ".643", "Rd 3" all sort sensibly); click again to
// reverse. Non-numeric columns (like team names) sort alphabetically.
function makeSortable(table){
  const thead = table.querySelector("thead");
  const tbody = table.querySelector("tbody");
  if(!thead || !tbody) return;
  const ths = Array.from(thead.querySelectorAll("th"));
  function parseVal(v){
    const m = v.replace(/,/g,"").match(/[+-]?(?:\d+\.?\d*|\.\d+)/);
    return m ? parseFloat(m[0]) : null;
  }
  ths.forEach((th, colIdx)=>{
    th.addEventListener("click", ()=>{
      const rows = Array.from(tbody.querySelectorAll("tr"));
      const newDir = th.dataset.sortDir==="asc" ? "desc" : "asc";
      ths.forEach(t=>{ t.removeAttribute("data-sort-dir"); t.classList.remove("sorted-asc","sorted-desc"); });
      th.dataset.sortDir = newDir;
      th.classList.add(newDir==="asc"?"sorted-asc":"sorted-desc");
      function cellText(row){ const c = row.children[colIdx]; return c ? c.textContent.trim() : ""; }
      const isNumeric = rows.slice(0,6).some(r=>parseVal(cellText(r))!==null);
      rows.sort((a,b)=>{
        const va = cellText(a), vb = cellText(b);
        if(isNumeric){
          const na = parseVal(va), nb = parseVal(vb);
          const na2 = na===null?-Infinity:na, nb2 = nb===null?-Infinity:nb;
          return newDir==="asc" ? na2-nb2 : nb2-na2;
        }
        return newDir==="asc" ? va.localeCompare(vb) : vb.localeCompare(va);
      });
      rows.forEach(r=>tbody.appendChild(r));
    });
  });
}

function attachPageHandlers(){

    const pInput = document.getElementById("adminPassword");

  const admGenerateBtn = document.getElementById("admGenerateBtn");
  if(admGenerateBtn){
    admGenerateBtn.addEventListener("click", ()=>{
      const year = document.getElementById("admYear").value;
      const week = document.getElementById("admWeek").value;
      const playoff = document.getElementById("admPlayoff").value.trim();
      const rows = [];
      const usedOwners = [];
      let allFilled = true;
      document.querySelectorAll(".admin-game-row").forEach(row=>{
        const teamA = row.querySelector(".admTeamA").value;
        const scoreA = row.querySelector(".admScoreA").value;
        const teamB = row.querySelector(".admTeamB").value;
        const scoreB = row.querySelector(".admScoreB").value;
        const isChamp = row.querySelector(".admIsChamp").checked;
        if(scoreA==="" || scoreB===""){ allFilled = false; return; }
        usedOwners.push(teamA, teamB);
        rows.push({teamA, scoreA:parseFloat(scoreA), teamB, scoreB:parseFloat(scoreB), isChamp});
      });
      if(!allFilled){ alert("Fill in all 12 scores before generating."); return; }
      if(new Set(usedOwners).size !== 12){
        if(!confirm("Heads up: the 6 matchups don't cover all 12 teams exactly once (a team is missing or used twice). Generate anyway?")) return;
      }
      const gLines = rows.map(r=>{
        const champFlag = r.isChamp ? ",true" : "";
        return `    ["${currentTeamName(r.teamA)}",${r.scoreA},"${currentTeamName(r.teamB)}",${r.scoreB}${champFlag}]`;
      }).join(",\n");
      const snippet = `{w:${week}, playoff:${playoff?`"${playoff}"`:'null'}, g:[\n${gLines}\n  ]}`;
      const out = document.getElementById("admOutputText");
      out.value = `// Year ${year}, Week ${week}${playoff?', '+playoff:''}\n${snippet}`;

    });
  }

      const status = document.getElementById("admCopyStatus");
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(ta.value).then(()=>{ status.textContent = "Copied."; });
      } else {

  }

function setupSearch(){
  const input = document.getElementById("teamSearch");
  const box = document.getElementById("searchResults");
  if(!input || !box) return;

  const teamEntries = allOwnerIdsSorted().filter(id=>id!=="rm2").map(id=>({
    type:"team", id, label: currentTeamName(id),
    search: [currentTeamName(id), ...teamHistory(id)].join(" ").toLowerCase()
  }));
  const featureEntries = FEATURE_INDEX.map(f=>({
    type:"page", page: f.page, label: f.label,
    search: [f.label, f.page, ...(f.keywords||[])].join(" ").toLowerCase()
  }));
  const index = [...teamEntries, ...featureEntries];

  function goToResult(item){
    if(item.type==="team"){ goToTeamReport(item.id); }
    else { currentPage = item.page; renderNav(); renderPage(); window.scrollTo(0,0); }
  }

  function show(matches){
    if(!matches.length){ box.innerHTML = '<div class="none">No matches</div>'; }
    else {
      box.innerHTML = matches.map((m,i)=>`<button data-i="${i}">${m.label}${m.type==="page"?` <span class="note" style="margin:0">&middot; ${m.page}</span>`:''}</button>`).join("");
    }
    box.classList.add("open");
    box._matches = matches;
  }

  input.addEventListener("input", ()=>{
    const q = input.value.trim().toLowerCase();
    if(!q){ box.classList.remove("open"); box.innerHTML=""; return; }
    const matches = index.filter(m => m.search.includes(q)).slice(0,8);
    show(matches);
  });

  input.addEventListener("keydown", e=>{
    if(e.key==="Enter"){
      const first = box._matches && box._matches[0];
      if(first){ goToResult(first); input.value=""; box.classList.remove("open"); box.innerHTML=""; input.blur(); }
    } else if(e.key==="Escape"){
      box.classList.remove("open"); input.blur();
    }
  });

  box.addEventListener("click", e=>{
    const btn = e.target.closest("button[data-i]");
    if(!btn || !box._matches) return;
    goToResult(box._matches[+btn.dataset.i]);
    input.value = "";
    box.classList.remove("open");
    box.innerHTML = "";
  });

  document.addEventListener("click", e=>{
    if(!e.target.closest(".search-wrap")) box.classList.remove("open");
  });
}
